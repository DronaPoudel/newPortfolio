name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ---- build client ----
      - name: Build & push client image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/newportfolio-client:latest \
            -f client/Dockerfile .
          docker push ghcr.io/${{ github.repository_owner }}/newportfolio-client:latest

      # ---- build server ----
      - name: Build & push server image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/newportfolio-server:latest \
            -f server/Dockerfile .
          docker push ghcr.io/${{ github.repository_owner }}/newportfolio-server:latest

      # ---- deploy on Hetzner ----
      - name: Deploy on Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/newportfolio
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_TOKEN }}
            docker compose pull
            docker compose up -d
